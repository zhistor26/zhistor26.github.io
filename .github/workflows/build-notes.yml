name: Publish notes

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'scripts/build-notes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Build pages and feed
        run: python3 scripts/build-notes.py
      - name: Publish generated files
        run: |
          git add -A reading content/notes.js feed.xml index.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build notes from Markdown'
          git push
